services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - worldnew_uploads:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      autoheal: "true"
    image: dcerm/worldnew-app:latest

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worldnew
      POSTGRES_USER: worldnew
      POSTGRES_PASSWORD: worldnew
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/worldnew_schema.sql:/docker-entrypoint-initdb.d/001-worldnew_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldnew -d worldnew"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: webtest898@gmail.com
      PGADMIN_DEFAULT_PASSWORD: WebTest1@Ola
    ports:
      - "8080:80"
    depends_on:
      - postgres
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres_data:
  worldnew_uploads:
